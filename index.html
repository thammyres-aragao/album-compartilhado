<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Celebre Moments</title>

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                ✨
            </div>

            <h1>Celebre Moments</h1>

            <p class="slogan">
                Compartilhando emoções e memórias.
            </p>

            <div class="evento">
                Casamento de <strong>Matheus & Maria Clara</strong>
            </div>

            <div class="preview">

                <video
                    id="camera"
                    autoplay
                    playsinline
                    muted>
                </video>

                <canvas
                    id="canvas"
                    style="display:none;">
                </canvas>

                <img
                    id="fotoCapturada"
                    style="display:none;">

            </div>

            <button id="btnCapturar" class="btn">
                📸 Capturar Foto
            </button>

            <button id="btnNovaFoto" class="btn" style="display:none;">

                🔄 Tirar outra foto

            </button>

            <button id="btnContinuar" class="btn" style="display:none;">

                 ➜ Continuar

            </button>

            <button id="btnTrocar" class="btn">
                🔄 Trocar câmera
            </button>

            <button id="btnGaleria" class="btn">
                🖼 Escolher da galeria
            </button>

            <div id="areaLegenda" style="display:none;">

            <textarea placeholder="Escreva uma legenda..."></textarea>

            </div>

            <button id="btnEnviar" class="btn-enviar" style="display:none;">
                Compartilhar Momento
            </button>

        </div>

    </div>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/camera.js"></script>
    <script src="assets/js/preview.js"></script>
    <script src="assets/js/upload.js"></script>
    <script src="assets/js/app.js"></script>

</body>

</html>
