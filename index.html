<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Celebre Moments</title>

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">

                <img id="logoEvento" src="" alt="Logo do evento">

                <div id="marcaSistema">

                    <span id="logoPadrao">✨</span>

                    <h1 id="tituloSistema">Celebre Moments</h1>

                    <p class="slogan">
                        Compartilhando emoções e memórias.
                    </p>

                </div>

            </div>

            <div class="evento">

                <h2 id="nomeEvento"></h2>

                <p id="mensagemBoasVindas"></p>

            </div>

            <div class="preview">

                <video
                    id="camera"
                    autoplay
                    playsinline
                    muted>
                </video>

                <canvas
                    id="canvas"
                    style="display:none;">
                </canvas>

                <img
                    id="fotoCapturada"
                    style="display:none;">

            </div>

            <div id="etapaCaptura">

                <button id="btnCapturar" class="btn">
                    📸 Capturar Foto
                </button>

                <button id="btnTrocar" class="btn btn-secundario">
                    🔄 Trocar câmera
                </button>

                <button id="btnGaleria" class="btn btn-secundario">
                    🖼 Escolher da galeria
                </button>

            </div>

            <div id="etapaAprovacao" style="display:none;">

                <div class="botoes-aprovacao">

                    <button id="btnNovaFoto" class="btn btn-secundario">
                        🔄 Tirar outra
                    </button>

                    <button id="btnContinuar" class="btn">
                        ➜ Continuar
                    </button>

                </div>

            </div>

            <div id="etapaEnvio" style="display:none;">

                <textarea
                    id="legenda"
                    placeholder="Escreva uma legenda...(Opcional)">
                </textarea>

                <button id="btnEnviar" class="btn-enviar">
                    Compartilhar Momento
                </button>

            </div>

            <div id="loading" class="loading" style="display:none;">

                <div class="loading-box">

                    <div class="spinner"></div>

                        <h3>Enviando sua foto...</h3>

                        <p>Aguarde alguns instantes.</p>

                    </div>

                </div>

            </div>

            <div id="modalMensagem" class="modal" style="display:none;">

                <div class="modal-box">

                    <div id="modalIcone" class="modal-icone">
                         ✔
                    </div>

                    <h2 id="modalTitulo">
                         Obrigado!
                    </h2>

                    <p id="modalTexto"></p>

                    <button id="btnModalOk" class="btn-enviar">
                        OK
                    </button>

                 </div>

            </div>

        </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/camera.js"></script>
    <script src="assets/js/preview.js"></script>
    <script src="assets/js/upload.js"></script>
    <script src="assets/js/evento.js"></script>
    <script src="assets/js/nomeArquivo.js"></script>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/app.js"></script>

</body>

</html>
